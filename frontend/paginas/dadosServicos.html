<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados Serviços</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <h3>CADASTRAR SERVIÇO</h3>

    <input type="text" id="nomeServico" placeholder="Nome"><br>
    <input type="number" id="precoServico" placeholder="Preço"><br>

    <button id="btnAdicionar">ADICIONAR</button>
    <button id="btnCancelarCadastro">CANCELAR</button>
    <br><br>

    <h3>PROCURAR SERVIÇO</h3>
    <input type="text" id="procurarServico" placeholder="Nome"><br>

    <button id="btnProcurar">PROCURAR</button>
    <button id="btnCancelarBusca">CANCELAR</button>
    <br><br>

    <h3>LISTA</h3>

    <div class="lista-servico">
        <ul id="listaServico"></ul>
    </div>

    <button id="btnModificar">MODIFICAR</button>
    <button id="btnExcluir">EXCLUIR</button>

    <script src="../js/dadosServico.js"> </script>
</body>
</html>
