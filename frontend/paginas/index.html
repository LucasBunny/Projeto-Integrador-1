<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Login</title>
</head>
<body>

    <main class="wrapper-login">
        <div class="container_card">
            
            <div class="top_card">
                <h2>LOGIN</h2>
            </div>

            <form id="formLogin">
                <div class="inputs_card">
                    <div class="input-group-login">
                        <label for="nomeLogin">Nome:</label>
                        <input type="text" id="nomeLogin" placeholder="Digite o usuário">        
                    </div>
                    
                    <div class="input-group-login">
                        <label for="senhaLogin">Senha:</label>
                        <input type="password" id="senhaLogin" placeholder="Digite a senha">
                    </div>
                </div>

                <div class="buttons_card">
                    <button type="submit" id="btnEntrar" class="btn-login btn-entrar">Entrar</button>
                    <button type="button" id="btnCriarConta" class="btn-login btn-criar-conta">Criar Conta</button>
                </div>
            </form>
            
        </div>
    </main>
    
    <script src="../js/login.js"></script>
</body>
</html>
