<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Criar Conta</title>
</head>

<body>
    <!--  Criacao dos campos de cadastro de usuarios  -->
    <h3>Nome:</h3>
    <input type="text" placeholder="Digite o Nome Completo">
    <h3>Senha:</h3>
    <input type="password" placeholder="Digite a Senha">
    <h3>Confirme a Senha:</h3>
    <input type="password" placeholder="Digite a Senha novamente">
    <br>
    <br>
    <!--  Botoes de Salvar e Cancelar - Ambos direcionam para a pagina index.html
      
        Na fase de validacao, o botao de salvar deve validar os campos e criar a conta, enquanto o botao de cancelar deve apenas redirecionar para a pagina index.html sem criar a conta.
    -->
    <button><a href="index.html">Salvar</a></button>
    <button><a href="index.html">Cancelar</a></button>
</body>

</html>
